spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ""
    password: ""
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

auth:
  refresh-cookie-secure: false

password-reset:
  client-url: ${PASSWORD_RESET_CLIENT_URL:http://localhost:3000/reset-password}
  mail-from: ${MAIL_FROM:no-reply@delvex.local}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
