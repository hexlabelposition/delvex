spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA:public}
  data:
    redis:
      url: ${REDIS_URL}

resend:
  api-key: ${RESEND_API_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

auth:
  refresh-cookie-secure: true

password-reset:
  client-url: ${PASSWORD_RESET_CLIENT_URL}
  mail-from: ${MAIL_FROM}
