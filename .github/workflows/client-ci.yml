name: Client CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect client changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes in the current update
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          head_sha="$CURRENT_SHA"
          base_sha="$EVENT_BEFORE"
          separator=".."

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"

            if [[ "$EVENT_ACTION" == "synchronize" && -n "$EVENT_BEFORE" ]]; then
              base_sha="$EVENT_BEFORE"
            else
              base_sha="$PR_BASE_SHA"
              separator="..."
            fi
          fi

          changed_files="$(mktemp)"
          git fetch --no-tags origin "$base_sha" "$head_sha" || true

          if ! git diff --name-only "${base_sha}${separator}${head_sha}" > "$changed_files"; then
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "$changed_files"
            else
              echo "Unable to calculate the push diff; running client checks conservatively."
              echo "client/" > "$changed_files"
            fi
          fi

          echo "Changed files in this update:"
          sed 's/^/- /' "$changed_files"

          if grep -Eq '^(client/|\.github/workflows/client-ci\.yml$)' "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.changed == 'true'

    defaults:
      run:
        working-directory: client

    env:
      API_URL: https://api.example.com
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SITE_URL: https://app.example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run linting
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Run unit and component tests
        run: bun run test

      - name: Discover browser tests
        run: bunx playwright test --list

      - name: Build production client
        run: bun run build

  production-image:
    name: Production container build
    runs-on: ubuntu-latest
    needs:
      - changes
      - quality
    if: needs.changes.outputs.changed == 'true'

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production container
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.com
          --build-arg NEXT_PUBLIC_SITE_URL=https://app.example.com
          --tag delvex-client:ci
          .
