spring:
  application:
    name: server
  profiles:
    group:
      dev: hosted
      prod: hosted
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA:public}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

auth:
  issuer: delvex
  access-token-secret: ${ACCESS_TOKEN_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  refresh-cookie-secure: true
  refresh-session-cleanup-interval: ${REFRESH_SESSION_CLEANUP_INTERVAL:1h}
  refresh-session-cleanup-initial-delay: ${REFRESH_SESSION_CLEANUP_INITIAL_DELAY:1h}

password-reset:
  client-url: ${PASSWORD_RESET_CLIENT_URL:http://localhost:3000/reset-password}
  token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
  mail-from: ${MAIL_FROM:no-reply@delvex.local}
  cleanup-interval: ${PASSWORD_RESET_CLEANUP_INTERVAL:1h}
  cleanup-initial-delay: ${PASSWORD_RESET_CLEANUP_INITIAL_DELAY:1h}

rate-limit:
  auth:
    window: ${AUTH_RATE_LIMIT_WINDOW:1m}
    register-requests: ${AUTH_RATE_LIMIT_REGISTER_REQUESTS:5}
    login-requests: ${AUTH_RATE_LIMIT_LOGIN_REQUESTS:10}
    refresh-requests: ${AUTH_RATE_LIMIT_REFRESH_REQUESTS:30}
    forgot-password-requests: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_REQUESTS:5}
    reset-password-requests: ${AUTH_RATE_LIMIT_RESET_PASSWORD_REQUESTS:10}
    trusted-proxy-cidrs: ${AUTH_RATE_LIMIT_TRUSTED_PROXY_CIDRS:}
    proxy-secret: ${AUTH_RATE_LIMIT_PROXY_SECRET:}

springdoc:
  api-docs:
    enabled: false
    path: /docs/openapi.json
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    disable-swagger-default-url: true

logging:
  level:
    "[com.delvex.server]": ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-none} %logger{36} - %msg%n"
