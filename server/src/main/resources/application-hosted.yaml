spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA:public}
  data:
    redis:
      host: ${REDIS_HOST}
  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

auth:
  refresh-cookie-secure: true

password-reset:
  client-url: ${PASSWORD_RESET_CLIENT_URL}
  mail-from: ${MAIL_FROM}
