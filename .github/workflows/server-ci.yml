name: Server CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - "compose.yaml"
  push:
    branches:
      - dev
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - "compose.yaml"

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delvex_test
          POSTGRES_USER: delvex
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delvex -d delvex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: delvex_test
      POSTGRES_USER: delvex
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_PASSWORD: test-password
      ACCESS_TOKEN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ALLOWED_ORIGINS: https://app.example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run server tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore

  production-smoke:
    name: Production JAR smoke
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delvex_prod_smoke
          POSTGRES_USER: delvex
          POSTGRES_PASSWORD: smoke-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delvex -d delvex_prod_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: localhost
      POSTGRES_DB: delvex_prod_smoke
      POSTGRES_USER: delvex
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_PASSWORD: smoke-password
      ACCESS_TOKEN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ALLOWED_ORIGINS: https://app.example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Make scripts executable
        run: chmod +x mvnw scripts/production-smoke.sh

      - name: Package production JAR
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Run production HTTP smoke
        run: ./scripts/production-smoke.sh

      - name: Build production container
        run: docker build --tag delvex-server:ci .

      - name: Upload production smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-production-smoke-log
          path: server/target/production-smoke.log
          if-no-files-found: ignore
