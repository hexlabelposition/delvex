spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}?currentSchema=public
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

auth:
  issuer: delvex
  access-token-secret: ${ACCESS_TOKEN_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /docs/openapi.json
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true

logging:
  level:
    com.delvex.server: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-none} %logger{36} - %msg%n"
