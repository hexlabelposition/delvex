name: Server CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - "compose.yaml"
  push:
    branches:
      - dev
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - "compose.yaml"

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect server changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes in the current update
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          head_sha="$CURRENT_SHA"
          base_sha="$EVENT_BEFORE"
          separator=".."

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"

            if [[ "$EVENT_ACTION" == "synchronize" && -n "$EVENT_BEFORE" ]]; then
              base_sha="$EVENT_BEFORE"
            else
              base_sha="$PR_BASE_SHA"
              separator="..."
            fi
          fi

          changed_files="$(mktemp)"
          git fetch --no-tags origin "$base_sha" "$head_sha" || true

          if ! git diff --name-only "${base_sha}${separator}${head_sha}" > "$changed_files"; then
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "$changed_files"
            else
              echo "Unable to calculate the push diff; running server checks conservatively."
              echo "server/" > "$changed_files"
            fi
          fi

          echo "Changed files in this update:"
          sed 's/^/- /' "$changed_files"

          if grep -Eq '^(server/|\.github/workflows/server-ci\.yml$|compose\.yaml$)' "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.changed == 'true'

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delvex_test
          POSTGRES_USER: delvex
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delvex -d delvex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: delvex_test
      POSTGRES_USER: delvex
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_PASSWORD: test-password
      ACCESS_TOKEN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ALLOWED_ORIGINS: https://app.example.com
      PASSWORD_RESET_CLIENT_URL: https://app.example.com/reset-password
      RESEND_API_KEY: re_ci-not-used
      MAIL_FROM: no-reply@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run server tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/target/surefire-reports/
          if-no-files-found: ignore

  production-smoke:
    name: Production JAR smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.changed == 'true'

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delvex_prod_smoke
          POSTGRES_USER: delvex
          POSTGRES_PASSWORD: smoke-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delvex -d delvex_prod_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: localhost
      POSTGRES_DB: delvex_prod_smoke
      POSTGRES_USER: delvex
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_PASSWORD: smoke-password
      ACCESS_TOKEN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ALLOWED_ORIGINS: https://app.example.com
      PASSWORD_RESET_CLIENT_URL: https://app.example.com/reset-password
      RESEND_API_KEY: re_ci-not-used
      MAIL_FROM: no-reply@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Package production JAR
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Run production HTTP smoke
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=ProductionSmokeIT test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: false
          tags: delvex-server:ci
          cache-from: type=gha,scope=server-production-image
          cache-to: type=gha,mode=max,scope=server-production-image

      - name: Upload production smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-production-smoke-log
          path: server/target/production-smoke.log
          if-no-files-found: ignore

