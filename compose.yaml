services:
  client:
    container_name: delvex-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_URL: ${API_URL:-http://server:8080}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    container_name: delvex-server
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE=local for Compose}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      REFRESH_SESSION_CLEANUP_INTERVAL: ${REFRESH_SESSION_CLEANUP_INTERVAL:-1h}
      REFRESH_SESSION_CLEANUP_INITIAL_DELAY: ${REFRESH_SESSION_CLEANUP_INITIAL_DELAY:-1h}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
      AUTH_RATE_LIMIT_REGISTER_REQUESTS: ${AUTH_RATE_LIMIT_REGISTER_REQUESTS:-5}
      AUTH_RATE_LIMIT_LOGIN_REQUESTS: ${AUTH_RATE_LIMIT_LOGIN_REQUESTS:-10}
      AUTH_RATE_LIMIT_REFRESH_REQUESTS: ${AUTH_RATE_LIMIT_REFRESH_REQUESTS:-30}
      AUTH_RATE_LIMIT_FORGOT_PASSWORD_REQUESTS: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_REQUESTS:-5}
      AUTH_RATE_LIMIT_RESET_PASSWORD_REQUESTS: ${AUTH_RATE_LIMIT_RESET_PASSWORD_REQUESTS:-10}
      AUTH_RATE_LIMIT_TRUSTED_PROXY_CIDRS: "${AUTH_RATE_LIMIT_TRUSTED_PROXY_CIDRS:-}"
      PASSWORD_RESET_CLIENT_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL}/reset-password
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-30m}
      PASSWORD_RESET_CLEANUP_INTERVAL: ${PASSWORD_RESET_CLEANUP_INTERVAL:-1h}
      PASSWORD_RESET_CLEANUP_INITIAL_DELAY: ${PASSWORD_RESET_CLEANUP_INITIAL_DELAY:-1h}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@delvex.local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:8080/api/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    container_name: delvex-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    container_name: delvex-redis
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    container_name: delvex-mailpit
    image: axllent/mailpit:v1.30.7
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
