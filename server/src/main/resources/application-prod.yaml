spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?currentSchema=${POSTGRES_SCHEMA:public}
  data:
    redis:
      host: ${REDIS_HOST}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

auth:
  refresh-cookie-secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
