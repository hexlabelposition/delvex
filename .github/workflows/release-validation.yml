name: Release validation

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "client/**"
      - "server/**"
      - "compose.yaml"
      - "RELEASE.md"
      - ".github/workflows/release-validation.yml"
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1
  SPRING_PROFILES_ACTIVE: prod
  POSTGRES_DB: delvex_release
  POSTGRES_USER: delvex
  POSTGRES_PASSWORD: release-test-password
  POSTGRES_SCHEMA: public
  ACCESS_TOKEN_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  CORS_ALLOWED_ORIGINS: https://app.delvex.test:3443
  AUTH_RATE_LIMIT_REGISTER_REQUESTS: 100
  AUTH_RATE_LIMIT_LOGIN_REQUESTS: 100
  AUTH_RATE_LIMIT_REFRESH_REQUESTS: 100
  LOG_LEVEL: INFO
  NODE_ENV: production
  API_URL: http://server:8080
  NEXT_PUBLIC_API_URL: https://api.delvex.test:8443
  NEXT_PUBLIC_SITE_URL: https://app.delvex.test:3443
  E2E_EMPLOYEE_EMAIL: release-employee@example.test
  E2E_EMPLOYEE_PASSWORD: Release-test-123!

jobs:
  full-stack-smoke:
    name: Production full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify release versions
        run: |
          set -euo pipefail
          server_version=$(sed -n '/<artifactId>server<\/artifactId>/{n;s:.*<version>\(.*\)</version>.*:\1:p;q}' server/pom.xml)
          client_version=$(bun -e 'console.log(require("./client/package.json").version)')
          test "$server_version" = "1.0.0"
          test "$client_version" = "1.0.0"
          test "$(java -version 2>&1 | sed -n 's/.*version "\([0-9]*\).*/\1/p')" = "21"

      - name: Install locked client dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: client
        run: bunx playwright install --with-deps chromium

      - name: Verify Compose API routing
        run: |
          set -euo pipefail
          rendered_api_url=$(API_URL=http://localhost:8080 docker compose config --format json | jq --raw-output '.services.client.environment.API_URL')
          test "$rendered_api_url" = "http://server:8080"

      - name: Start clean production stack
        run: |
          set -euo pipefail
          docker compose down --volumes --remove-orphans || true
          docker compose up --build --detach --wait --wait-timeout 240

      - name: Verify clean Flyway migration history
        run: |
          set -euo pipefail
          applied=$(docker compose exec -T postgres psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --tuples-only --no-align \
            --command "SELECT count(*) FROM flyway_schema_history WHERE success;")
          test "$applied" = "4"
          docker compose exec -T postgres psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --tuples-only --no-align \
            --command "SELECT version FROM flyway_schema_history WHERE version = '4' AND success;" \
            | grep --fixed-strings --line-regexp "4"

      - name: Provision isolated test employee
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"$E2E_EMPLOYEE_EMAIL\",\"password\":\"$E2E_EMPLOYEE_PASSWORD\",\"firstName\":\"Release\",\"lastName\":\"Employee\"}" \
            http://127.0.0.1:8080/api/auth/register >/dev/null
          updated=$(docker compose exec -T postgres psql \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --tuples-only --no-align \
            --command "WITH updated AS (UPDATE users SET role = 'EMPLOYEE' WHERE email = '$E2E_EMPLOYEE_EMAIL' RETURNING role) SELECT role FROM updated;")
          test "$updated" = "EMPLOYEE"

      - name: Start test TLS gateway
        run: |
          set -euo pipefail
          gateway_dir=$(mktemp -d)
          echo "GATEWAY_DIR=$gateway_dir" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$gateway_dir/tls.key" \
            -out "$gateway_dir/tls.crt" \
            -subj "/CN=delvex.test" \
            -addext "subjectAltName=DNS:app.delvex.test,DNS:api.delvex.test" >/dev/null 2>&1
          cat >"$gateway_dir/nginx.conf" <<'EOF'
          events {}
          http {
            server {
              listen 3443 ssl;
              server_name app.delvex.test;
              ssl_certificate /etc/nginx/tls.crt;
              ssl_certificate_key /etc/nginx/tls.key;
              location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
              }
            }
            server {
              listen 8443 ssl;
              server_name api.delvex.test;
              ssl_certificate /etc/nginx/tls.crt;
              ssl_certificate_key /etc/nginx/tls.key;
              location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
              }
            }
          }
          EOF
          echo "127.0.0.1 app.delvex.test api.delvex.test" | sudo tee -a /etc/hosts >/dev/null
          docker run --detach --name delvex-release-gateway \
            --network host \
            --volume "$gateway_dir/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$gateway_dir/tls.crt:/etc/nginx/tls.crt:ro" \
            --volume "$gateway_dir/tls.key:/etc/nginx/tls.key:ro" \
            nginx:1.29-alpine
          for _ in {1..30}; do
            if curl --insecure --fail --silent --show-error \
              https://app.delvex.test:3443 >/dev/null \
              && curl --insecure --fail --silent --show-error \
              https://api.delvex.test:8443/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "TLS gateway did not become ready" >&2
          exit 1

      - name: Run critical Playwright flow
        working-directory: client
        env:
          PLAYWRIGHT_BASE_URL: https://app.delvex.test:3443
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
          E2E_API_BASE_URL: https://api.delvex.test:8443
        run: bun run test:e2e

      - name: Capture service logs
        if: failure()
        run: |
          docker compose logs --no-color > release-validation.log 2>&1 || true
          docker logs delvex-release-gateway >> release-validation.log 2>&1 || true

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-diagnostics
          path: |
            release-validation.log
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore

      - name: Stop release stack
        if: always()
        run: |
          docker rm --force delvex-release-gateway 2>/dev/null || true
          docker compose down --volumes --remove-orphans || true
